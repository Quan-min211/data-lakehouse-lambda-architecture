version: '3.8'

# =============================================================================
# Data Lakehouse — Lambda Architecture
# Stack: Kafka KRaft | MinIO | Iceberg REST | Spark | ClickHouse | Redis | FastAPI | Streamlit
# Total mem budget: ~7.5-8.5 GB RAM (fits 16 GB machine with OS headroom)
# Run: docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # KAFKA (KRaft Mode — No ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: lakehouse-kafka
    hostname: kafka
    ports:
      - "9092:9092"    # Internal PLAINTEXT
      - "9094:9094"    # External access from host
    environment:
      - KAFKA_ENABLE_KRAFT=yes
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_CFG_NUM_PARTITIONS=3
      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_CFG_LOG_RETENTION_HOURS=24
      - KAFKA_HEAP_OPTS=-Xmx768m -Xms256m
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - lakehouse-net
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MINIO (S3-compatible Object Storage — Master Dataset / Bronze)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: lakehouse-minio
    hostname: minio
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - lakehouse-net
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # MinIO bootstrap: create required buckets on first startup
  minio-setup:
    image: minio/mc:latest
    container_name: lakehouse-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/warehouse;
        mc mb --ignore-existing local/bronze;
        mc mb --ignore-existing local/silver;
        mc mb --ignore-existing local/gold;
        echo '>>> MinIO buckets ready.';
        exit 0;
      "

  # ---------------------------------------------------------------------------
  # ICEBERG REST CATALOG
  # ---------------------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:0.10.0
    container_name: lakehouse-iceberg-rest
    hostname: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER:-minioadmin}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # APACHE SPARK — Master
  # ---------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5
    container_name: lakehouse-spark-master
    hostname: spark-master
    ports:
      - "8080:8080"    # Spark Web UI  →  http://localhost:8080
      - "7077:7077"    # Spark Master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./src:/app/src:ro
      - ./configs/spark/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf:ro
    networks:
      - lakehouse-net
    mem_limit: 768m

  # ---------------------------------------------------------------------------
  # APACHE SPARK — Worker
  # ---------------------------------------------------------------------------
  spark-worker:
    image: bitnami/spark:3.5
    container_name: lakehouse-spark-worker
    hostname: spark-worker
    ports:
      - "8081:8081"    # Worker Web UI
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
    volumes:
      - ./src:/app/src:ro
    depends_on:
      - spark-master
    networks:
      - lakehouse-net
    mem_limit: 2560m

  # ---------------------------------------------------------------------------
  # CLICKHOUSE (OLAP Engine — Batch Views + Speed Views)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.6-alpine
    container_name: lakehouse-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"    # HTTP interface
      - "9009:9009"    # Native TCP
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-lakehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lakehouse-net
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ---------------------------------------------------------------------------
  # REDIS (Speed Views Hot Cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: lakehouse-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - lakehouse-net
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # FASTAPI (Serving Layer — Auto-Correcting Query Merger)
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.serving
    container_name: lakehouse-fastapi
    hostname: fastapi
    ports:
      - "8000:8000"    # REST API  →  http://localhost:8000/docs
    env_file:
      - .env
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-lakehouse}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./src:/app/src
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lakehouse-net
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # STREAMLIT (Dashboard UI)
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: lakehouse-streamlit
    hostname: streamlit
    ports:
      - "8501:8501"    # Dashboard  →  http://localhost:8501
    environment:
      - FASTAPI_URL=http://fastapi:8000
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      - fastapi
    networks:
      - lakehouse-net
    mem_limit: 512m

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  kafka-data:
  minio-data:
  clickhouse-data:
  redis-data:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  lakehouse-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
