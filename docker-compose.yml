# =============================================================================
# Data Lakehouse — Lambda Architecture
# Stack: Kafka KRaft | MinIO | Iceberg REST | Spark | ClickHouse | Redis | FastAPI | Streamlit
# Total mem budget: ~7.5-8.5 GB RAM (fits 16 GB machine with OS headroom)
# Run: docker compose up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # KAFKA (KRaft Mode — Official Apache Kafka Image — No ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: lakehouse-kafka
    hostname: kafka
    ports:
      - "9092:9092"    # Internal PLAINTEXT for containers
      - "9094:9094"    # External access from host (localhost:9094)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824 # 1 GB max per partition
      KAFKA_LOG_SEGMENT_BYTES: 104857600    # 100 MB segments
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    networks:
      - lakehouse-net
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # MINIO (S3-compatible Object Storage — Master Dataset / Bronze)
  # ---------------------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: lakehouse-minio
    hostname: minio
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console  →  http://localhost:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - lakehouse-net
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # MinIO bootstrap: create required buckets on first startup
  minio-setup:
    image: amazon/aws-cli:latest
    container_name: lakehouse-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: /bin/sh
    command: >
      -c "
        aws --endpoint-url http://minio:9000 s3 mb s3://warehouse 2>/dev/null || true &&
        aws --endpoint-url http://minio:9000 s3 mb s3://bronze   2>/dev/null || true &&
        aws --endpoint-url http://minio:9000 s3 mb s3://silver   2>/dev/null || true &&
        aws --endpoint-url http://minio:9000 s3 mb s3://gold     2>/dev/null || true &&
        echo '>>> MinIO buckets ready.'
      "


  # ---------------------------------------------------------------------------
  # ICEBERG REST CATALOG
  # ---------------------------------------------------------------------------
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: lakehouse-iceberg-rest
    hostname: iceberg-rest
    ports:
      - "8181:8181"
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: ${MINIO_ROOT_USER:-minioadmin}
      CATALOG_S3_SECRET__ACCESS__KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse-net
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # SPARK MASTER / WORKER / THRIFT SERVER
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: lakehouse-spark-master
    hostname: spark-master
    user: root
    ports:
      - "7077:7077"    # Spark master
      - "8080:8080"    # Spark master UI
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    networks:
      - lakehouse-net
    mem_limit: 768m

  spark-worker:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: lakehouse-spark-worker
    hostname: spark-worker
    user: root
    ports:
      - "8081:8081"    # Spark worker UI
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - lakehouse-net
    mem_limit: 2500m

  spark-thrift:
    image: apache/spark:3.5.9-scala2.12-java17-python3-r-ubuntu
    container_name: lakehouse-spark-thrift
    hostname: spark-thrift
    user: root
    ports:
      - "10000:10000"  # dbt-spark Thrift endpoint
      - "4040:4040"    # Spark app UI
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      /bin/bash -c "
        /opt/spark/sbin/start-thriftserver.sh
        --master spark://spark-master:7077
        --hiveconf hive.server2.thrift.bind.host=0.0.0.0
        --hiveconf hive.server2.thrift.port=10000
        --conf spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
        --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.iceberg_catalog=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.iceberg_catalog.type=rest
        --conf spark.sql.catalog.iceberg_catalog.uri=http://iceberg-rest:8181
        --conf spark.sql.catalog.iceberg_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        --conf spark.sql.catalog.iceberg_catalog.warehouse=s3://warehouse/
        --conf spark.sql.catalog.iceberg_catalog.s3.endpoint=http://minio:9000
        --conf spark.sql.catalog.iceberg_catalog.s3.path-style-access=true
        --conf spark.hadoop.fs.s3a.endpoint=http://minio:9000
        --conf spark.hadoop.fs.s3a.access.key=${MINIO_ROOT_USER:-minioadmin}
        --conf spark.hadoop.fs.s3a.secret.key=${MINIO_ROOT_PASSWORD:-minioadmin}
        --conf spark.hadoop.fs.s3a.path.style.access=true
        --conf spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
        --conf spark.hadoop.fs.s3a.connection.ssl.enabled=false
        && tail -f /opt/spark/logs/*
      "
    depends_on:
      - spark-master
      - spark-worker
      - iceberg-rest
      - minio-setup
    networks:
      - lakehouse-net
    mem_limit: 1500m

  # ---------------------------------------------------------------------------
  # SPEED LAYER — Spark Structured Streaming (Kafka → ClickHouse)
  # Giai phap thay the cho viec chay Spark tren Windows Host (tranh loi winutils.exe).
  # Container nay chay tren Linux nen khong bi anh huong boi van de Windows Hadoop.
  # ---------------------------------------------------------------------------
  speed-layer:
    build:
      context: .
      dockerfile: Dockerfile.speed
    container_name: lakehouse-speed-layer
    hostname: speed-layer
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Spark chay che do local[2] trong container (khong can Spark cluster)
      - SPARK_MASTER_URL=local[2]
      # Ket noi Kafka qua bridge network (ten service = hostname trong Docker)
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC_RAW=${KAFKA_TOPIC_RAW:-crypto_trades_raw}
      # Ket noi ClickHouse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-lakehouse}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      # Checkpoint luu vao volume de giu trang thai khi container restart
      - CHECKPOINT_DIR=/app/checkpoints/speed_layer
      # Trigger moi 5 giay (SLA < 5s end-to-end)
      - SPEED_TRIGGER_INTERVAL=5 seconds
      - PYTHONPATH=/app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    volumes:
      - ./src:/app/src
      - speed-checkpoints:/app/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - lakehouse-net
    mem_limit: 2g
    # Ghi log ra stdout de theo doi qua: docker compose logs -f speed-layer
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # BATCH PIPELINE — Spark Batch Job (Bronze → Silver → Gold → ClickHouse)
  # Ghi Bronze records vao Iceberg (MinIO) voi --write-iceberg --iceberg-strict.
  # Khac voi spark_batch_jobs.py chay tren Windows Host (khong ghi Iceberg that),
  # service nay LUON ghi Iceberg that va BAO LOI ro rang neu MinIO khong san sang.
  #
  # Cach chay mot lan:
  #   docker compose run --rm batch-pipeline
  # Hoac theo lich (vi du: moi gio):
  #   docker compose up -d batch-pipeline  (restart: on-failure)
  # ---------------------------------------------------------------------------
  batch-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.batch
    container_name: lakehouse-batch-pipeline
    hostname: batch-pipeline
    # Chay xong thi thoat (restart khi that bai, khong restart khi thanh cong)
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      - SPARK_MASTER_URL=local[*]
      # MinIO — luu tru Bronze Iceberg Parquet files
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Iceberg REST Catalog
      - ICEBERG_REST_URI=http://iceberg-rest:8181
      # ClickHouse — luu tru Gold candles va Watermark
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-lakehouse}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - PYTHONPATH=/app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    volumes:
      - ./src:/app/src
      - ./datasets:/app/datasets
      - ./results:/app/results
    depends_on:
      minio:
        condition: service_healthy
      iceberg-rest:
        condition: service_started
      clickhouse:
        condition: service_healthy
    networks:
      - lakehouse-net
    mem_limit: 3g

  # ---------------------------------------------------------------------------
  # CLICKHOUSE (OLAP Engine — Batch Views + Speed Views)
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: lakehouse-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"    # HTTP interface
      - "9009:9000"    # Native TCP (Host 9009 -> Container 9000)
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-lakehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./configs/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lakehouse-net
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ---------------------------------------------------------------------------
  # REDIS (Speed Views Hot Cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: lakehouse-redis
    hostname: redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - lakehouse-net
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # FASTAPI (Serving Layer — Auto-Correcting Query Merger)
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.serving
    container_name: lakehouse-fastapi
    hostname: fastapi
    ports:
      - "8000:8000"    # REST API  →  http://localhost:8000/docs
    env_file:
      - path: .env
        required: false
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-lakehouse}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./src:/app/src
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lakehouse-net
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # STREAMLIT (Dashboard UI)
  # ---------------------------------------------------------------------------
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: lakehouse-streamlit
    hostname: streamlit
    ports:
      - "8501:8501"    # Dashboard  →  http://localhost:8501
    environment:
      - FASTAPI_URL=http://fastapi:8000
      - CLICKHOUSE_HOST=clickhouse
      - REDIS_HOST=redis
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      - fastapi
    networks:
      - lakehouse-net
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # DAGSTER (Batch Orchestration UI + Schedules)
  # ---------------------------------------------------------------------------
  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: lakehouse-dagster
    hostname: dagster
    ports:
      - "3000:3000"    # Dagster UI -> http://localhost:3000
    env_file:
      - path: .env
        required: false
    environment:
      - DAGSTER_HOME=/opt/dagster/dagster_home
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - MINIO_ENDPOINT=http://minio:9000
      - ICEBERG_REST_URI=http://iceberg-rest:8181
      - SPARK_MASTER_URL=spark://spark-master:7077
      - BATCH_WRITE_ICEBERG=false
    volumes:
      - ./src:/app/src
      - ./dagster_project:/app/dagster_project
      - ./datasets:/app/datasets
      - ./results:/app/results
      - dagster-home:/opt/dagster/dagster_home
    depends_on:
      clickhouse:
        condition: service_healthy
      spark-thrift:
        condition: service_started
    networks:
      - lakehouse-net
    mem_limit: 1g

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  kafka-data:
  minio-data:
  clickhouse-data:
  redis-data:
  dagster-home:
  speed-checkpoints:

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  lakehouse-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
