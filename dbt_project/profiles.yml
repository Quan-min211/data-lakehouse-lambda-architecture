lambda_spark:
  target: dev
  outputs:
    dev:
      type: spark
      method: thrift
      host: "{{ env_var('DBT_SPARK_HOST', 'localhost') }}"
      port: 10000
      schema: default
      # Tăng timeout và retries để tránh connection abort khi Spark thực thi query lâu
      connect_timeout: 120
      connect_retries: 5
