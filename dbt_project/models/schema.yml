version: 2

models:
  - name: bronze_crypto_trades
    description: "Typed view over the Iceberg Bronze TradeEvent table."
    columns:
      - name: trade_id
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null

  - name: silver_cleaned_trades
    description: "Validated and deduplicated TradeEvent records. Partitioned by trade_date (daily)."
    tests:
      # trade_id cua Binance chi duy nhat trong tung symbol, nen kiem tra unique tren khoa
      # ghep (symbol, trade_id) - dung khoa khu trung cua row_number() va dq_checks.py
      - unique:
          column_name: "concat(symbol, ':', cast(trade_id as string))"
    columns:
      - name: trade_id
        tests:
          - not_null
      - name: symbol
        tests:
          - not_null
      - name: price
        tests:
          - not_null
      - name: quantity
        tests:
          - not_null
      - name: trade_date
        description: "Partition key — ngày UTC của trade_time_ts, dùng cho INSERT OVERWRITE partitioning."
        tests:
          - not_null

  - name: gold_market_aggregates
    description: "Reconciled one-minute OHLCV/VWAP candles for ClickHouse batch views."
    columns:
      - name: symbol
        tests:
          - not_null
      - name: window_start
        tests:
          - not_null
