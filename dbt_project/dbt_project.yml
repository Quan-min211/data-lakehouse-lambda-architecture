name: 'lambda_lakehouse_dbt'
version: '1.0.0'
config-version: 2

profile: 'lambda_spark'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  lambda_lakehouse_dbt:
    +file_format: parquet
    bronze:
      +materialized: view
    silver:
      +materialized: incremental
    gold:
      +materialized: table
