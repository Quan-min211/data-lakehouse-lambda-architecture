# =============================================================================
# Apache Spark Configuration for Iceberg & MinIO S3
# =============================================================================

# Packages for Iceberg, AWS S3, and Kafka
spark.jars.packages               org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0

# SQL Extensions
spark.sql.extensions              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Iceberg REST Catalog Configuration (pointing to MinIO S3)
spark.sql.catalog.iceberg_catalog org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg_catalog.type rest
spark.sql.catalog.iceberg_catalog.uri http://iceberg-rest:8181
spark.sql.catalog.iceberg_catalog.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg_catalog.warehouse s3://warehouse/
spark.sql.catalog.iceberg_catalog.s3.endpoint http://minio:9000
spark.sql.catalog.iceberg_catalog.s3.path-style-access true

# Hadoop S3A FileSystem for Direct MinIO Access
spark.hadoop.fs.s3a.endpoint      http://minio:9000
spark.hadoop.fs.s3a.access.key    minioadmin
spark.hadoop.fs.s3a.secret.key    minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.impl          org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.connection.ssl.enabled false

# Spark Resource Limits
spark.driver.memory               1g
spark.executor.memory             2g
spark.sql.shuffle.partitions      4
spark.default.parallelism         4
